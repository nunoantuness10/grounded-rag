[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "grounded-rag"
version = "0.1.0"
description = "A dependency-light, citation-aware RAG pipeline with offline evaluation."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Nuno Antunes" }]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
grounded-rag = "grounded_rag.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/grounded_rag"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

